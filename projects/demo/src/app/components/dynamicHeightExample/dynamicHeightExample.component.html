<button (click)="isLoading.set(!isLoading())">Toggle loading</button>
<div
  style="background-color: azure; width: 320px; margin: 1rem;"
  [ngxIsLoading]="isLoading()"
>
  <p>
    When loading multiple data, it is possible, that the height of the container growths.
    So this example ensures, that the loading overlay resizes accordingly.
  </p>
  <p>
    {{ dynamicContent() }}
  </p>
  <div>
    <button (click)="isLoading.set(!isLoading())">Toggle loading</button>
  </div>
</div>
